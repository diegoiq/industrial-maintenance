services:
  # 1. Frontend Web & PWA (Campo + Ingeniería)
  - type: web
    name: industrial-maintenance-web
    runtime: node
    rootDir: apps/web
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_API_ENGINE_URL
        fromService:
          type: web
          name: industrial-maintenance-engine
          property: host

  # 2. Motor de Cubicaciones, Planos, IA y Telemetría (FastAPI)
  - type: web
    name: industrial-maintenance-engine
    runtime: python
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RENDER_API_KEY
        sync: false # Opcional: solo lectura para métricas de Render
